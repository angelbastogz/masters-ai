[project]
name = "document-workflows-lab"
version = "0.1.0"
description = "Route a document analysis workflow with LangGraph"
requires-python = ">=3.12"
dependencies = ["langgraph>=1,<2", "pydantic>=2,<3", "typing-extensions>=4.12,<5", "requests>=2,<3"]

[dependency-groups]
dev = ["mypy>=1,<3", "ipykernel>=6,<8", "nbconvert>=7,<8", "pip>=25,<27"]
